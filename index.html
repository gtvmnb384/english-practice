<style>

body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(180deg,var(--night),var(--ink));font-family:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink)}

button{width:100%;min-height:48px;border:0;border-radius:999px;background:var(--ink);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
button:disabled{opacity:.6}
.err{min-height:20px;margin-top:10px;color:#9a3d22;font-size:14px}

    return S.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"])
      .then(function(k){return S.deriveBits({name:"PBKDF2",salt:b64(SALT),iterations:ITER,hash:"SHA-256"},k,512);})
      .then(function(b){return new Uint8Array(b);});
  }
  function decrypt(key){
    var d=b64(DATA),n=d.length,iv=d.slice(0,16),ct=d.slice(16,n-32),tag=d.slice(n-32);
    return S.importKey("raw",key.slice(32),{name:"HMAC",hash:"SHA-256"},false,["verify"])
      .then(function(hk){return S.verify("HMAC",hk,tag,d.slice(0,n-32));})
      .then(function(ok){
        if(!ok)return null;
        return S.importKey("raw",key.slice(0,32),"AES-CBC",false,["decrypt"])
          .then(function(ak){return S.decrypt({name:"AES-CBC",iv:iv},ak,ct);})
          .then(function(pt){return new TextDecoder().decode(pt);});
      });
  }
  function show(html){document.open();document.write(html);document.close();}
  var f=document.getElementById("f"),pw=document.getElementById("pw"),rm=document.getElementById("rm"),
      go=document.getElementById("go"),err=document.getElementById("err");
  function ask(){f.hidden=false;pw.focus();}
  if(!S){f.hidden=false;err.textContent="這個瀏覽器不支援解密，請用 Safari 或 Chrome 開啟。";go.disabled=true;return;}
  f.addEventListener("submit",function(e){
    e.preventDefault();err.textContent="";go.disabled=true;go.textContent="解鎖中…";
    var key;
    derive(pw.value).then(function(k){key=k;return decrypt(k);}).then(function(html){
      if(!html){err.textContent="密碼不對，再試一次。";go.disabled=false;go.textContent="開啟";pw.select();return;}
      try{if(rm.checked)localStorage.setItem(SK,tob64(key));else localStorage.removeItem(SK);}catch(x){}
      show(html);
    }).catch(function(){err.textContent="解鎖失敗，請再試一次。";go.disabled=false;go.textContent="開啟";});
  });
  // Start only after this lock page has fully loaded: document.open() while the parser is
  // still active would append the app to this page instead of replacing it.
  function start(){
    var saved=null;try{saved=localStorage.getItem(SK);}catch(x){}
    if(!saved){ask();return;}
    decrypt(b64(saved)).then(function(html){
      if(html){show(html);return;}
      try{localStorage.removeItem(SK);}catch(x){}
      ask();
    }).catch(ask);
  }
  if(document.readyState==="complete")setTimeout(start,0);
  else window.addEventListener("load",function(){setTimeout(start,0);});
})();
</script>

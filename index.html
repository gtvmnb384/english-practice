<style>
:root{--ink:#211c55;--night:#0d0b27;--ember:#f2783f;--ground:#eef0f7;--muted:#57547a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(180deg,var(--night),var(--ink));font-family:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink)}
.box{width:100%;max-width:360px;background:#fff;border-radius:22px;padding:26px 22px;box-shadow:0 22px 50px -26px rgba(0,0,0,.6)}
h1{margin:0 0 6px;font-size:22px}
p{margin:0 0 16px;color:var(--muted);font-size:14px}
input[type=password]{width:100%;min-height:50px;padding:12px 16px;border:1.5px solid transparent;border-radius:14px;background:var(--ground);font-size:16px}
input[type=password]:focus{outline:none;border-color:var(--ink);background:#fff}
label{display:flex;align-items:center;gap:8px;margin:12px 0 16px;font-size:14px;color:var(--muted)}
button{width:100%;min-height:48px;border:0;border-radius:999px;background:var(--ink);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
button:disabled{opacity:.6}
.err{min-height:20px;margin-top:10px;color:#9a3d22;font-size:14px}
</style>

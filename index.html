<style>
/* Visual language inspired by the MIT "Farlight" template: indigo dusk, ember accent, frosted/white rounded cards, pill buttons. Recreated, not copied. */
:root{
  --ground:#eef0f7;--ink:#211c55;--white:#fff;--night:#0d0b27;--ember:#f2783f;--ember-d:#d9551f;
  --muted:#57547a;--peri:#b8c1ee;--rose:#e7b6cb;--blue:#323d80;--line:#dde1f0;--ok:#2f8f6b;
  --f-display:"Gabarito","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-body:"Onest","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
  --r1:30px;--r2:22px;--pill:999px;
  --shadow:0 22px 50px -26px rgba(13,11,39,.45);
  --ease:cubic-bezier(.6,0,.2,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:clip}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
::selection{background:var(--peri);color:var(--ink)}
.preanim .hero .w,.preanim .hero .sub,.preanim .hero .chips,.preanim #app{opacity:0}

/* floating pill bar */
.topbar{position:sticky;top:10px;z-index:40;display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 12px 0;pointer-events:none}
.topbar>*{pointer-events:auto}
.topbar{transition:transform .55s var(--ease)}
.topbar[data-hidden]{transform:translateY(calc(-100% - 24px))}
.brand{display:inline-flex;align-items:center;gap:10px;min-height:46px;padding:6px 18px 6px 8px;border-radius:var(--pill);background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:var(--shadow);text-decoration:none;color:var(--ink);font-family:var(--f-display);font-weight:500;font-size:17px;letter-spacing:-.01em}
.mark{width:32px;height:32px;border-radius:50%;background:linear-gradient(180deg,var(--ember) 0 48%,var(--ink) 48%);display:grid;place-items:center;color:#fff;font-size:15px}
.pillbtn{display:inline-flex;align-items:center;gap:10px;min-height:46px;padding:6px 6px 6px 18px;border:0;border-radius:var(--pill);background:var(--ink);color:#fff;font-weight:500;font-size:15px;cursor:pointer;box-shadow:var(--shadow);text-decoration:none}
.disc{width:34px;height:34px;border-radius:50%;background:var(--ember);color:var(--night);display:grid;place-items:center;flex:none;transition:transform .5s var(--ease)}
.disc svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (hover:hover){.pillbtn:hover .disc,.quizbtn:hover .disc{transform:rotate(-45deg)}}

/* hero: a rounded "dusk window" with a thick white frame */
.hero{padding:12px 12px 0}
.hero-window{position:relative;overflow:hidden;border:6px solid #fff;border-radius:var(--r1);box-shadow:var(--shadow);color:#fff;padding:92px 22px 26px;min-height:300px;
  background:
    radial-gradient(1.5px 1.5px at 12% 22%,#fff 60%,transparent 61%),radial-gradient(1px 1px at 28% 12%,#fff 60%,transparent 61%),
    radial-gradient(1.2px 1.2px at 64% 18%,#fff 60%,transparent 61%),radial-gradient(1px 1px at 82% 30%,#fff 60%,transparent 61%),
    radial-gradient(1.4px 1.4px at 46% 34%,rgba(255,255,255,.8) 60%,transparent 61%),radial-gradient(1px 1px at 90% 9%,#fff 60%,transparent 61%),
    radial-gradient(120% 70% at 80% 115%,rgba(231,182,203,.95),rgba(231,182,203,0) 60%),
    radial-gradient(90% 60% at 10% 120%,rgba(242,120,63,.55),rgba(242,120,63,0) 60%),
    linear-gradient(180deg,var(--night) 0%,var(--ink) 45%,var(--blue) 100%)}
.hero-window::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-30px;height:90px;background:var(--night);border-radius:50% 50% 0 0/100% 100% 0 0;opacity:.55}
.hero .eyebrow{color:var(--peri)}
.hero h1{position:relative;z-index:1;margin:6px 0 10px;font-family:var(--f-display);font-weight:500;font-size:clamp(46px,14vw,92px);line-height:.92;letter-spacing:-.035em}
.hero .ln{display:block;overflow:hidden;padding-bottom:.06em}
.hero .w{display:inline-block}
.hero .sub{position:relative;z-index:1;margin:0;max-width:30ch;color:#e9ebfa;font-size:16px}
.chips{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--pill);background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-size:13px;font-weight:500}
body[data-view="day"] .hero-window,body[data-view="quiz"] .hero-window,body[data-view="words"] .hero-window,body[data-view="notes"] .hero-window{min-height:0;padding:72px 20px 16px}
body[data-view="day"] .hero h1,body[data-view="quiz"] .hero h1,body[data-view="words"] .hero h1,body[data-view="notes"] .hero h1{font-size:28px;margin:0}
body[data-view="day"] .hero .ln,body[data-view="quiz"] .hero .ln,body[data-view="words"] .hero .ln,body[data-view="notes"] .hero .ln{display:inline}
body[data-view="day"] .hero .eyebrow,body[data-view="quiz"] .hero .eyebrow,body[data-view="words"] .hero .eyebrow,body[data-view="notes"] .hero .eyebrow{display:none}
body[data-view="day"] .hero .sub,body[data-view="day"] .chips,body[data-view="words"] .hero .sub,body[data-view="notes"] .hero .sub,body[data-view="words"] .chips,body[data-view="quiz"] .hero .sub,body[data-view="quiz"] .chips,body[data-view="notes"] .chips{display:none}
.hero{margin-top:-56px}

.wrap{max-width:760px;margin:0 auto;padding:6px 14px 20px}
.eyebrow{display:block;font-size:12.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sec-head{margin:26px 6px 6px}
.sec-head h2,.page-title{margin:2px 0 0;font-family:var(--f-display);font-weight:500;font-size:32px;line-height:1.05;letter-spacing:-.025em}
.page-title{margin:10px 6px 2px}

/* cards */
.card{position:relative;background:#fff;border-radius:var(--r2);padding:18px 18px;margin:14px 0;box-shadow:0 1px 0 rgba(33,28,85,.04),0 18px 40px -28px rgba(13,11,39,.35);border:1px solid rgba(33,28,85,.06)}
.day{display:block;text-decoration:none;color:var(--ink);cursor:pointer;padding:20px 20px 18px;transition:transform .4s var(--ease)}
.day:active{transform:scale(.985)}
.day h2{margin:0 0 6px;font-family:var(--f-display);font-weight:500;font-size:28px;letter-spacing:-.02em;line-height:1.1}
.day .meta{color:var(--muted);font-size:14px;line-height:1.5}
.day .meta+.meta{margin-top:8px;color:var(--ink);font-weight:500}
.day::after{content:"→";position:absolute;right:16px;top:18px;width:38px;height:38px;border-radius:50%;background:var(--ember);color:var(--night);display:grid;place-items:center;font-weight:600}
.day h2{padding-right:48px}
.bar{height:8px;background:#e3e6f4;border-radius:var(--pill);overflow:hidden;margin-top:12px}
.bar>div{height:100%;background:linear-gradient(90deg,var(--ink),var(--blue) 70%,var(--ember));border-radius:var(--pill);transition:width .6s var(--ease)}

/* quiz call-to-action: a night window */
.quizbtn{position:relative;display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;text-align:left;border:6px solid #fff;border-radius:var(--r1);padding:22px 18px 22px 22px;margin:18px 0 4px;color:#fff;cursor:pointer;box-shadow:var(--shadow);
  background:radial-gradient(80% 90% at 100% 100%,rgba(242,120,63,.45),transparent 60%),linear-gradient(135deg,var(--night),var(--ink) 60%,var(--blue));font-family:var(--f-display);font-weight:500;font-size:28px;letter-spacing:-.02em;line-height:1.1;transition:transform .4s var(--ease)}
.quizbtn:active{transform:scale(.985)}
.quizbtn small{display:block;margin-top:6px;font-family:var(--f-body);font-size:14px;font-weight:400;letter-spacing:0;color:var(--peri)}
.quizbtn .disc{width:48px;height:48px}

/* tabs: segmented pill */
nav.tabs{display:flex;gap:4px;margin:14px 0 4px;padding:5px;background:#fff;border-radius:var(--pill);box-shadow:var(--shadow)}
nav.tabs button{flex:1;min-height:46px;border:0;border-radius:var(--pill);background:transparent;color:var(--muted);font-weight:600;font-size:15px;cursor:pointer;transition:background .35s var(--ease),color .35s var(--ease)}
nav.tabs button.on{background:var(--ink);color:#fff}
.back{display:inline-flex;align-items:center;gap:8px;min-height:44px;border:0;border-radius:var(--pill);background:#fff;color:var(--ink);padding:6px 16px 6px 6px;cursor:pointer;box-shadow:var(--shadow);font-weight:500;font-size:15px}
.back .disc{width:32px;height:32px}

.task{background:#fff}
.task strong{font-family:var(--f-display);font-weight:500;font-size:19px;letter-spacing:-.01em}

.topic{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;padding-right:90px}
.q{font-family:var(--f-display);font-weight:500;font-size:21px;line-height:1.3;letter-spacing:-.01em;margin:8px 0 8px}
.hint{font-size:14px;color:var(--muted)}
input[type=text]{width:100%;min-height:50px;padding:12px 16px;border:1.5px solid transparent;border-radius:16px;background:var(--ground);font-size:16px;margin-top:10px;transition:border-color .3s,background .3s}
input[type=text]:focus{outline:none;border-color:var(--ink);background:#fff}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{min-height:46px;border:none;background:var(--ink);color:#fff;padding:10px 18px;border-radius:var(--pill);cursor:pointer;font-size:15px;font-weight:500;transition:transform .2s var(--ease),background .3s}
.btn:active,.back:active,.pillbtn:active{transform:scale(.96)}
.btn.mic{background:var(--ember);color:var(--night);font-weight:600}
.btn.mic.rec{background:var(--night);color:var(--ember)}
.btn.ghost{background:var(--ground);color:var(--ink)}
.btn.stop{background:var(--ember-d);color:#fff}

.shadow{margin-top:12px;padding:14px 16px;border-radius:18px;background:#f6f7fc;border:1.5px solid var(--line);font-size:15px;transition:background .35s,border-color .35s}
.shadow:empty{display:none}
.shadow .model{font-family:var(--f-display);font-weight:500;font-size:18px;line-height:1.35;margin:8px 0 2px}
.shadow .st{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.shadow .ph{font-weight:600;border-radius:var(--pill);padding:3px 12px;color:#fff;background:var(--muted);font-size:14px}
.shadow .turn{color:var(--ember-d);font-weight:700;font-size:17px}
.shadow .cd{font-variant-numeric:tabular-nums;background:#fff;border-radius:var(--pill);padding:2px 12px;font-weight:700;color:var(--ember-d)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--ember-d);display:inline-block;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
.tbar{height:7px;background:#f9d7c6;border-radius:var(--pill);overflow:hidden;margin-top:10px}
.tbar>div{height:100%;background:var(--ember-d);width:100%}
.shadow .btn{font-size:14px;padding:8px 14px;min-height:42px}
.shadow.ph-listen{background:#e9ecfb;border-color:var(--blue)}
.shadow.ph-listen .ph{background:var(--blue)}
.shadow.ph-ready{background:#fbedf3;border-color:#c96b95}
.shadow.ph-ready .ph{background:#b4527f;font-size:16px}
.shadow.ph-rec{background:#fff1e9;border-color:var(--ember)}
.shadow.ph-done{background:#e8f5ef;border-color:var(--ok)}
.shadow.ph-done .ph{background:var(--ok)}
.shadow.ph-warn{background:#fff7ea;border-color:#e0a84f}
.recinfo{margin-top:8px;font-size:13px;color:var(--muted)}
.linkbtn{border:none;background:none;color:var(--ember-d);font-size:13px;padding:6px 4px;cursor:pointer;text-decoration:underline}

.fb{margin-top:12px;padding:12px 14px;border-radius:16px;display:none;font-size:15px}
.fb.ok{background:#e8f5ef;color:#1f5f47;display:block}
.fb.no{background:#fdece4;color:#9a3d22;display:block}

.card.item.checked{border:2px solid var(--ok);background:linear-gradient(180deg,#f3fbf7,#fff 120px)}
.done-badge{position:absolute;right:14px;top:14px;background:var(--ok);color:#fff;border-radius:var(--pill);padding:3px 12px;font-size:12.5px;font-weight:600}
.chkrow{border-top:1px dashed var(--line);padding-top:12px;margin-top:14px}
.btn.chk{width:100%;background:#fff;color:var(--ok);border:2px solid var(--ok);font-weight:600}
.btn.chk.on{background:var(--ok);color:#fff}
.day.alldone{border:2px solid var(--ok)}
.party{position:absolute;right:62px;top:22px;background:#fff1d6;color:#8a5a00;border-radius:var(--pill);padding:2px 10px;font-size:13px;font-weight:600}
.datetag{position:absolute;right:14px;top:14px;background:#e9ecfb;color:var(--blue);border-radius:var(--pill);padding:3px 10px;font-size:12px;font-weight:600}
.qstat{position:absolute;right:14px;top:42px;background:#e8f5ef;color:var(--ok);border-radius:var(--pill);padding:3px 10px;font-size:12px;font-weight:600}
.summary{border:6px solid #fff;text-align:center;color:#fff;background:radial-gradient(80% 90% at 100% 100%,rgba(242,120,63,.4),transparent 60%),linear-gradient(135deg,var(--night),var(--ink));border-radius:var(--r1)}
.summary h3{margin:0 0 8px;font-family:var(--f-display);font-weight:500;font-size:28px;letter-spacing:-.02em}
.summary .btn{background:var(--ember);color:var(--night)}.summary .btn.ghost{background:rgba(255,255,255,.14);color:#fff}
.summary .row{justify-content:center}
.blank{display:inline-block;min-width:64px;border-bottom:2.5px solid var(--ember);margin:0 4px}
.hidden{display:none}
.tbend{display:flex;gap:8px}
.pillbtn.sm{padding:6px 16px}
.pillbtn.light{background:rgba(255,255,255,.96);color:var(--ink);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.wordsbtn{text-decoration:none;margin-top:12px;background:radial-gradient(80% 90% at 100% 100%,rgba(231,182,203,.6),transparent 60%),linear-gradient(135deg,var(--blue),var(--ink))}
.wordsbtn b{color:#fff}
.wds{display:inline}
.wd{cursor:pointer;border-radius:6px;padding:0 1px;margin:0 -1px;-webkit-tap-highlight-color:transparent;transition:background .25s,box-shadow .25s,color .25s;-webkit-user-select:none;user-select:none}
.wd:hover{background:rgba(50,61,128,.08)}
.wd.on{background:linear-gradient(180deg,transparent 38%,rgba(242,120,63,.42) 38%);color:#7a2d0c;box-shadow:inset 0 -2px 0 var(--ember)}
.wd.hl{font-weight:700}
.wd.say{box-shadow:inset 0 -3px 0 var(--ember);animation:wsay .9s var(--ease) infinite}
@keyframes wsay{50%{box-shadow:inset 0 -1px 0 rgba(242,120,63,.35)}}
.wd.pop{animation:wpop .42s var(--ease)}
@keyframes wpop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.wd{display:inline-block}
.tiphint{margin-top:10px;padding:8px 12px;border-radius:12px;background:#fff1e9;color:#8a3a12;font-size:14px;font-weight:500}
.wcard .wword{font-family:var(--f-display);font-weight:500;font-size:40px;line-height:1.05;letter-spacing:-.02em;padding-right:100px;word-break:break-word}
.wcard.big{text-align:center;padding:28px 20px}
.wcard.big .wword{font-size:56px;padding:18px 0 6px}
.wcard.big .row{justify-content:center}
.btn.wbig{min-height:56px;font-size:18px;padding:12px 26px}
.wpos{margin-top:4px;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.wmeanrow{margin-top:10px}
.wmean{display:inline-block;border:0;background:#fff1e9;color:#7a2d0c;border-radius:14px;padding:8px 14px;font-size:20px;font-weight:600;line-height:1.35;text-align:left;cursor:pointer;font-family:var(--f-body)}
.wmean.none{background:var(--ground);color:var(--muted);font-size:15px;font-weight:500}
.wcard.big .wmean{font-size:24px}
.btn.reveal{min-height:52px;font-size:17px;padding:10px 26px}
.wsent{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:12px 14px;border-radius:16px;background:var(--ground);text-align:left;font-size:16px;line-height:1.55}
.sentplay{flex:none;width:40px;height:40px;border:0;border-radius:50%;background:var(--ink);color:#fff;font-size:14px;cursor:pointer}
.wfoot{justify-content:space-between;align-items:center}
.wcard.big .wfoot{justify-content:center}
.mastered summary{cursor:pointer;font-family:var(--f-display);font-weight:500;font-size:19px;min-height:30px}
.mastered .wcard{box-shadow:none;border:1px solid var(--line)}
.empty{text-align:center}
.ans{font-weight:600}
.rv{opacity:0;transform:translateY(26px)}
.rv.in{opacity:1;transform:none;transition:opacity .8s var(--ease),transform .8s var(--ease)}

footer{margin:28px 0 0;padding:34px 22px 0;background:var(--night);color:var(--peri);border-radius:var(--r1) var(--r1) 0 0;font-size:14px;overflow:hidden}
footer .fl{max-width:760px;margin:0 auto;line-height:1.7}
footer .wordmark{font-family:var(--f-display);font-weight:500;font-size:22vw;line-height:.8;letter-spacing:-.05em;color:var(--ink);margin:22px -4px -2vw;white-space:nowrap}
@media (min-width:760px){footer .wordmark{font-size:170px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.rv{opacity:1;transform:none}}
.ncard .nnum{display:inline-block;font-size:12px;font-weight:600;color:var(--night);background:var(--ember);border-radius:var(--pill);padding:2px 9px;margin-right:6px;letter-spacing:0}
.nrow{padding:12px 0;border-top:1px solid rgba(33,28,85,.08)}
.nrow:first-of-type{border-top:0}
.nen{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nen .q{margin:4px 0}
.nsay{flex:none;min-height:40px;padding:8px 14px}
.nsay.on{background:var(--night);color:var(--ember)}
.nnote{margin-top:4px;border-left:3px solid var(--ember);padding-left:10px}
</style>
</head>
<body>
<div class="topbar">
  <a class="brand" href="#" onclick="location.hash='';return false;"><span class="mark">☕</span>English</a>
  <div class="tbend"><a class="pillbtn sm light" href="#words">📒 單字</a><button class="pillbtn sm" onclick="startQuiz()">🎲 測驗</button></div>
</div>
<header class="hero">
  <div class="hero-window">
    <span class="eyebrow">Daily speaking practice · 每日英文</span>
    <h1><span class="ln"><span class="w">My</span> <span class="w">English</span></span> <span class="ln"><span class="w">Practice</span></span></h1>
    <p class="sub">A little practice every day goes a long way. 加油！</p>
    <div class="chips"><span class="chip">🔊 跟讀</span><span class="chip">✅ 每日任務</span><span class="chip">📒 單字本</span><span class="chip">🎲 隨機測驗</span></div>
  </div>
</header>
<div class="wrap" id="app"></div>
<footer><div class="fl">Progress is saved in this browser only · 🎙️ 錄音只存在這支手機上 · 🔊 跟讀：先聽標準發音，再錄自己的聲音 · <span id="appver" style="opacity:.7"></span></div><div class="wordmark" aria-hidden="true">Speak up.</div></footer>
<script defer src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script>
// Bump BOTH this constant and the <meta name="app-version"> tag on every release.
const APP_VERSION = "2026-11-12a";
(function(){
  var el=document.getElementById('appver'); if(el) el.textContent='v'+APP_VERSION;
  var busy=false;
  function toast(msg){var t=document.createElement('div');t.textContent=msg;
    t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 16px;border-radius:20px;font-size:.9rem;z-index:9999;opacity:.92';
    document.body.appendChild(t);}
  function check(){
    if(busy) return; busy=true;
    fetch(location.pathname+'?check='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():'';}).then(function(html){

      setTimeout(function(){location.replace(location.pathname+'?v='+encodeURIComponent(remote)+location.hash);},600);
    }).catch(function(){}).finally(function(){busy=false;});
  }
  window.addEventListener('load',check);
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')check();});

const BACK_SVG='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>';
const Motion=(function(){
  let reduce=false;try{reduce=!!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches);}catch(e){}
  const root=document.documentElement;
  let introDone=false,io=null;
  const g=()=>(!reduce&&window.gsap)?window.gsap:null;
  function intro(){
    if(introDone)return;introDone=true;
    const wasHidden=root.classList.contains("preanim");
    root.classList.remove("preanim");
    const G=g();if(!G||!wasHidden){view();return;}
    G.from(".hero .w",{yPercent:110,duration:1.1,ease:"expo.out",stagger:.08});
    G.from(".hero .sub,.hero .chips,.hero .eyebrow",{y:18,opacity:0,duration:.9,delay:.3,ease:"power3.out",stagger:.08});
    G.from(".hero-window",{scale:1.03,duration:1.4,ease:"power3.out",clearProps:"transform"});
    G.from(".topbar>*",{y:-20,opacity:0,duration:.8,ease:"power3.out",stagger:.08,clearProps:"all"});
    view(.25);
  }
  // Entrance for the current view: first screen staggers in, the rest reveals on scroll.
  function view(delay){
    if(reduce)return;
    const els=[...document.querySelectorAll("#app .anim")];
    const G=g(),first=els.slice(0,6),rest=els.slice(6);
    if(G)G.from(first,{y:28,opacity:0,duration:.75,delay:delay||0,ease:"power3.out",stagger:.06,clearProps:"transform,opacity"});
    if(!rest.length||!("IntersectionObserver" in window))return;
    if(io)io.disconnect();
    io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}}),{rootMargin:"0px 0px -8% 0px"});
    rest.forEach(el=>{el.classList.add("rv");io.observe(el);});
  }
  function pop(el){const G=g();if(G&&el)G.fromTo(el,{scale:.92},{scale:1,duration:.5,ease:"back.out(2.5)",clearProps:"transform"});}
  return {intro,view,pop,routed(){if(introDone)view();}};
})();

function noteById(id){return NOTES.find(n=>n.id===id);}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function sayNote(btn){const t=btn.getAttribute("data-say");if(!TTS||!window.SpeechSynthesisUtterance)return;
  document.querySelectorAll(".nsay.on").forEach(b=>b.classList.remove("on"));btn.classList.add("on");
  speakNow([t],{onEnd(){btn.classList.remove("on");}});}
function renderNotes(n){
  view="notes";
  app.innerHTML=`<div class="row"><button class="back" onclick="location.hash=''"><span class="disc">${BACK_SVG}</span>回首頁</button></div>
  <h2 class="page-title anim">📝 ${esc(n.title)}</h2>`+
  n.cards.map((c,ci)=>`<div class="card item ncard anim"><div class="topic"><span class="nnum">0${ci+1}</span>${c.icon} ${esc(c.name)}</div>`+
    c.rows.map(r=>`<div class="nrow">${r.en.map(e=>`<div class="nen"><div class="q">${wordsHTML(e,{dayId:n.id,sent:e})}</div><button class="btn mic nsay" data-say="${esc(e)}" onclick="sayNote(this)" aria-label="播放">🔊</button></div>`).join("")}<div class="hint nnote">💡 ${esc(r.note)}</div></div>`).join("")+`</div>`).join("");
}

// ===== Views =====
function route(){
  stopShadow();
  const h=decodeURIComponent(location.hash.slice(1));
  if(h==="quiz"){if(!quiz)newQuiz();renderQuiz();}
  else if(h.startsWith("notes-")&&noteById(h.slice(6))){renderNotes(noteById(h.slice(6)));}
  else if(h==="words"){wordsMode="list";wordsIdx=0;renderWords();}
  else{const day=dayById(h);day?renderDay(day):renderHome();}
  document.body.dataset.view=view;
  window.scrollTo(0,0);
  Motion.routed();
}
function renderHome(){
  view="home";quiz=null;
  const nSent=DAYS.reduce((n,d)=>n+d.sentences.length,0);
  app.innerHTML=`<button class="quizbtn anim" id="quiz-btn" onclick="startQuiz()"><span>🎲 隨機測驗<small>從所有日期隨機抽 ${Math.min(5,nSent)} 個句子來練習</small></span><span class="disc">${ARROW_SVG}</span></button>
  <a class="quizbtn wordsbtn anim" id="words-btn" href="#words"><span>📒 單字本<small>不熟的單字 <b class="wcount">${activeWords().length}</b> 個 · 中文解釋＋發音</small></span><span class="disc">${ARROW_SVG}</span></a>
  <div class="sec-head anim"><span class="eyebrow">Key points</span><h2>練習重點</h2></div>`+NOTES.slice().reverse().map(n=>`<a class="card day anim" id="notes-btn-${n.id}" href="#notes-${n.id}"><h2>📝 ${esc(n.title)}</h2><div class="meta">${n.cards.map(c=>c.name.split("：")[1]||c.name).join(" · ")}</div><div class="meta">💡 ${n.cards.reduce((k,c)=>k+c.rows.length,0)} 個重點</div></a>`).join("")+`
  <div class="sec-head anim"><span class="eyebrow">Practice days</span><h2>練習日期</h2></div>`+DAYS.slice().reverse().map(d=>{
    const st=dayStats(d);
    return `<a class="card day anim ${st.all?'alldone':''}" href="#${d.id}">${st.all?'<span class="party">🎉 完成</span>':''}<h2>📅 ${d.label}</h2>
      <div class="meta">${d.topics}</div>
      <div class="meta">✅ 語句 ${st.ns}/${d.sentences.length}</div>
      <div class="bar"><div style="width:${st.n/st.total*100}%"></div></div></a>`;}).join("");
}
function cardHTML(day,it,opt){
  opt=opt||{};
  const u=uid(day.id,it.id),isChk=!opt.quiz&&!!checked[key(day,it.id)];
  let head,q,ph;
  head=it.t+" · "+(it.type==="fill"?"Fill in the blank":"Fix the sentence");
  // Fill prompts save the full correct sentence as the example; fix prompts (which contain errors) do too.
  q=wordsHTML(it.type==="fill"?it.q:"“"+it.q+"”",{dayId:day.id,sent:it.show});
  ph=it.type==="fill"?"Type the missing words":"Type the corrected sentence";
  return `<div class="card item anim ${isChk?'checked':''}" id="card-${u}">
    ${opt.quiz?`<span class="datetag">📅 ${day.label}</span><span class="qstat hidden" id="qs-${u}"></span>`
      :`<span id="badge-${u}" class="done-badge ${isChk?'':'hidden'}">✓ 已完成</span>`}
    <div class="topic">${opt.quiz?`第 ${opt.num} 題 · `:""}${head}</div>
    <div class="q">${q}</div>
    ${it.hint?`<div class="hint">Hint: ${it.hint}</div>`:""}
    <input type="text" id="in-${u}" placeholder="${ph}" autocomplete="off" autocapitalize="off" onkeydown="if(event.key==='Enter')check('${day.id}','${it.id}')">
    <div class="row">
      <button class="btn" onclick="check('${day.id}','${it.id}')">Check</button>
      <button class="btn mic" id="sh-btn-${u}" onclick="shadow('${day.id}','${it.id}')">🔊 跟讀</button>
      <button class="btn ghost" onclick="reveal('${day.id}','${it.id}')">Show answer</button>
    </div>
    <div class="fb" id="fb-${u}"></div>
    <div class="shadow${recordings[u]?' ph-done':''}" id="sh-${u}" data-day="${day.id}" data-id="${it.id}">${shadowDoneHTML(day.id,it.id)}</div>
    ${opt.quiz?"":`<div class="row chkrow"><button class="btn chk ${isChk?'on':''}" id="chk-${u}" onclick="toggleCheck('${day.id}','${it.id}')">${chkLabel(isChk)}</button></div>`}
  </div>`;
}
function chkLabel(on){return on?"✓ 已完成（點一下取消）":"✅ 完成";}
function renderDay(day){
  view="day";
  stopShadow();
  const list=items(day);
  let html=`<div class="row"><button class="back" onclick="location.hash=''"><span class="disc">${BACK_SVG}</span>所有日期</button></div>
  <h2 class="page-title anim">📅 ${day.label}</h2>
  <div class="card task anim"><strong>今日任務：語句練習</strong> — <span id="sec-n"></span>
  <div class="bar"><div id="sec-bar"></div></div><div class="hint" id="sec-msg">覺得這題沒問題了，就按卡片下方的 ✅ 完成 勾起來。</div>
  <div class="tiphint">📒 點句子裡不熟的字，就會念給你聽並加入單字本</div></div>`;
  html+=list.map(it=>cardHTML(day,it)).join("");
  html+=`<div class="row"><button class="btn ghost" onclick="resetDay('${day.id}')">重設這一天的勾選</button></div>`;
  app.innerHTML=html;
  updateDayCounts(day);
  document.body.dataset.view="day";
}
function updateDayCounts(day){
  const st=dayStats(day),tot=st.total,n=st.ns;
  const sn=document.getElementById("sec-n"),sb=document.getElementById("sec-bar"),sm=document.getElementById("sec-msg");
  if(sn)sn.textContent=`${n} / ${tot}`;
  if(sb)sb.style.width=(tot?n/tot*100:0)+"%";
  if(sm)sm.textContent=st.all?"🎉 這一天的語句全部完成了！":"覺得這題沒問題了，就按卡片下方的 ✅ 完成 勾起來。";
}
function toggleCheck(dayId,id){
  const d=dayById(dayId),k=key(d,id),u=uid(dayId,id);
  if(checked[k])delete checked[k];else checked[k]=true;
  save();
  const on=!!checked[k];
  const card=document.getElementById("card-"+u),badge=document.getElementById("badge-"+u),btn=document.getElementById("chk-"+u);
  if(card)card.classList.toggle("checked",on);
  if(badge)badge.classList.toggle("hidden",!on);
  if(btn){btn.classList.toggle("on",on);btn.textContent=chkLabel(on);}
  if(on)Motion.pop(badge);
  updateDayCounts(d);
}

// Saved words from before v2026-11-05a get their meaning from GLOSS.
(function(){let ch=false;Object.values(words).forEach(x=>{if(x&&!x.m&&GLOSS[x.w]){x.m=GLOSS[x.w].m;x.p=GLOSS[x.w].p;ch=true;}});if(ch)saveWords();})();
// Fallback meanings (words not in GLOSS) from the free MyMemory API, cached locally.
const LKEY="english-lookup-v1";
let lookup={};try{lookup=JSON.parse(localStorage.getItem(LKEY)||"{}")||{};}catch(e){}
const lookupPending={};
function meaningOf(x){if(!x)return null;if(x.m)return x.m;if(GLOSS[x.w])return GLOSS[x.w].m;if(typeof lookup[x.w]==="string")return lookup[x.w]||"";return null;}
function fetchMeaning(w){
  if(lookupPending[w]||typeof lookup[w]==="string"||!window.fetch)return;
  lookupPending[w]=true;
  fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(w)+"&langpair="+encodeURIComponent("en|zh-TW"))
    .then(r=>r.ok?r.json():null)
    .then(j=>{
      let t=j&&j.responseData&&j.responseData.translatedText||"";
      t=String(t).trim();
      if(!t||/MYMEMORY|INVALID|QUERY LENGTH/i.test(t)||t.toLowerCase()===w)t="";
      return t;
    },()=>null)
    .then(t=>{
      delete lookupPending[w];
      if(t===null)return paintMeaning(w,true);          // network error: don't cache, show 暫無解釋
      lookup[w]=t;try{localStorage.setItem(LKEY,JSON.stringify(lookup));}catch(e){}
      if(words[w]&&!words[w].mEdited&&t){words[w].m=t;saveWords();}
      paintMeaning(w);
    });
}
function meaningText(x,failed){const m=meaningOf(x);return m?m:(m===null&&!failed?"查詢中…":"暫無解釋（點這裡自己加）");}

function normWord(w){return String(w).toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9'\-]/g,"").replace(/^['\-]+|['\-]+$/g,"");}
// Render text as tappable words. ctx = {dayId, sent} (sent = example sentence to save with the word).
function wordsHTML(text,ctx){
  const attrs=`data-day="${esc(ctx.dayId)}" data-sent="${esc(ctx.sent||text)}"`;
  return `<span class="wds" ${attrs}>`+String(text).split(/(\s+)/).map(tok=>{
    if(!tok)return "";
    if(/^\s+$/.test(tok))return tok;
    if(/^_{2,}$/.test(tok.replace(/[^_]/g,""))&&/_{2,}/.test(tok)){
      return tok.replace(/_{2,}/,'<span class="blank"></span>');   // keep punctuation around the blank
    }

    const pre=m?m[1]:"",core=m?m[2]:tok,post=m?m[3]:"";

    return `${esc(pre)}<span class="wd${words[w]?' on':''}" data-w="${esc(w)}" role="button" tabindex="0">${esc(core)}</span>${esc(post)}`;

const recordings={};   // uid -> blob URL of the user's latest recording
const recMeta={};      // uid -> timestamp (ms) of that recording

// ---- Saved recordings (IndexedDB, key "dayId/itemId"; quiz + day cards share it) ----
const RecDB=(function(){
  let dbp=null;
  function open(){
    if(dbp)return dbp;
    dbp=new Promise((res,rej)=>{
      try{
        if(!window.indexedDB)return rej(new Error("no indexedDB"));
        const r=indexedDB.open("english-practice",1);
        r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains("recordings"))r.result.createObjectStore("recordings");};
        r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error("blocked"));
      }catch(e){rej(e);}
    });
    dbp.catch(()=>{dbp=null;});
    return dbp;
  }
  function run(mode,fn){return open().then(db=>new Promise((res,rej)=>{
    const t=db.transaction("recordings",mode),out=fn(t.objectStore("recordings"));
    t.oncomplete=()=>res(out&&out.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);}));}
  return {
    put:(k,v)=>run("readwrite",st=>st.put(v,k)),
    del:k=>run("readwrite",st=>st.delete(k)),
    all:()=>open().then(db=>new Promise((res,rej)=>{
      const rows=[],t=db.transaction("recordings","readonly"),c=t.objectStore("recordings").openCursor();
      c.onsuccess=()=>{const cc=c.result;if(cc){rows.push([cc.key,cc.value]);cc.continue();}};
      t.oncomplete=()=>res(rows);t.onerror=()=>rej(t.error);}))
  };
})();
function recKey(dayId,id){return dayId+"/"+id;}
function saveRec(dayId,id,blob,type,ts){
  const k=recKey(dayId,id),base={type,ts,dayId,id};
  return RecDB.put(k,Object.assign({blob},base)).catch(()=>   // some Safari versions can't store Blobs → store bytes
    blob.arrayBuffer?blob.arrayBuffer().then(buf=>RecDB.put(k,Object.assign({buf},base))):Promise.reject()
  ).catch(()=>{});   // IndexedDB unavailable: recording still works for this session
}
function loadRecs(){
  return RecDB.all().then(rows=>{
    rows.forEach(([k,v])=>{
      if(!v)return;
      const dayId=v.dayId||String(k).split("/")[0],id=v.id||String(k).split("/").slice(1).join("/");
      const u=uid(dayId,id);
      if(recordings[u])return;   // a newer one was recorded meanwhile
      const blob=v.blob||(v.buf?new Blob([v.buf],{type:v.type||"audio/mp4"}):null);
      if(!blob)return;
      recordings[u]=URL.createObjectURL(blob);recMeta[u]=v.ts||0;
    });
    refreshPanels();
  }).catch(()=>{});
}

let cur=null;          // the one active session
let keepUtts=[];       // keep utterances referenced (Safari GC bug)
let player=null;       // shared <audio> for playback

// ---- Mic: one permission prompt per app session, but a FRESH capture for every recording ----
// micStream is the "permission holder": while a live stream exists, iOS doesn't re-prompt.
// Each round calls getUserMedia again (no prompt, because the holder is live), records with the
// new stream, then that new stream becomes the holder and the previous one is stopped.
// This avoids iOS's silent/muted track after speechSynthesis or <audio> changes the audio session.
let micStream=null,micPending=null,micReleaseTimer=null;
function micLive(st){return !!st&&st.getAudioTracks().some(t=>t.readyState==="live"&&!t.muted);}
function stopStream(st){if(st)st.getTracks().forEach(t=>{try{t.stop();}catch(e){}});}
function releaseMic(){
  if(micReleaseTimer){clearTimeout(micReleaseTimer);micReleaseTimer=null;}
  if(cur&&cur.rec&&cur.rec.state!=="inactive")return;   // never cut an active recording
  stopStream(micStream);micStream=null;
}
// Returns a brand-new stream for this round and makes it the holder.
function freshMic(){
  if(micPending)return micPending;
  const old=micStream;
  micPending=navigator.mediaDevices.getUserMedia({audio:true}).then(st=>{
    micPending=null;
    micStream=st;
    if(old&&old!==st)stopStream(old);    // stop the old holder only after the new one is live
    return st;
  },err=>{micPending=null;throw err;});
  return micPending;
}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden"){
    if(!micReleaseTimer&&micStream)micReleaseTimer=setTimeout(()=>{micReleaseTimer=null;releaseMic();},60000);
  }else if(micReleaseTimer){clearTimeout(micReleaseTimer);micReleaseTimer=null;}
});
window.addEventListener("pagehide",()=>{if(cur)stopShadow();releaseMic();});

// ---- Level meter (safety net for silent recordings) ----
let actx=null;
function ensureAudioCtx(){   // call inside the user's tap so iOS allows it
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return null;
    if(!actx||actx.state==="closed")actx=new AC();
    if(actx.state==="suspended"&&actx.resume)actx.resume().catch(()=>{});
    return actx;
  }catch(e){return null;}
}
// Returns {stop():{peak,samples}} measuring peak deviation from silence (0..1).
function startMeter(stream){
  const m={peak:0,samples:0,src:null,an:null,iv:null};
  try{
    const ctx=ensureAudioCtx();
    if(!ctx)return null;
    m.src=ctx.createMediaStreamSource(stream);
    m.an=ctx.createAnalyser();m.an.fftSize=1024;
    m.src.connect(m.an);
    const buf=new Float32Array(m.an.fftSize);
    m.iv=setInterval(()=>{
      if(ctx.state!=="running")return;
      m.an.getFloatTimeDomainData(buf);
      let pk=0;for(let i=0;i<buf.length;i++){const v=Math.abs(buf[i]);if(v>pk)pk=v;}
      m.samples++;if(pk>m.peak)m.peak=pk;
    },50);
  }catch(e){return null;}
  return {stop(){clearInterval(m.iv);try{m.src&&m.src.disconnect();}catch(e){}return {peak:m.peak,samples:m.samples};}};
}

function modelTexts(it){return it.kind==="vocab"?[it.show].concat(it.ex?[it.ex]:[]):[it.show];}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function panel(u){return document.getElementById("sh-"+u);}
function setPhase(p,ph,html){if(!p)return;p.className="shadow"+(ph?" ph-"+ph:"");p.innerHTML=html;}
function modelsHTML(it){const dayId=cur?cur.dayId:"";return modelTexts(it).map(t=>`<div class="model">${wordsHTML(t,{dayId,sent:t})}</div>`).join("");}
function mimePick(){
  if(!window.MediaRecorder||!MediaRecorder.isTypeSupported)return "";
  for(const t of ["audio/mp4","audio/webm;codecs=opus","audio/webm"])if(MediaRecorder.isTypeSupported(t))return t;
  return "";
}
// Recording window (seconds): scales with the words to say, optionally with the measured model duration.
function wordCount(texts){return [].concat(texts).join(" ").trim().split(/\s+/).filter(Boolean).length;}
function recWindow(texts,measured){
  const base=wordCount(texts)*0.45+1.2;
  let secs=base;
  // If we really measured the model speech, allow a bit longer for slow sentences, but never runaway.
  if(measured&&measured>0.4)secs=Math.max(base,Math.min(measured*1.25+0.8,base*1.6));
  return Math.round(Math.max(2.5,Math.min(15,secs))*10)/10;
}
function shadowDoneHTML(dayId,id,note){
  const u=uid(dayId,id),has=!!recordings[u];
  if(!has&&!note)return "";
  return `${note?`<div class="st" style="margin-bottom:6px">${note}</div>`:""}
    <div class="row" style="margin-top:0">
      ${has?`<button class="btn mic" onclick="playMine('${dayId}','${id}')">▶️ 聽我的錄音</button>`:""}
      <button class="btn ghost" onclick="replayModel('${dayId}','${id}')">🔊 再聽一次標準</button>
      <button class="btn" onclick="shadow('${dayId}','${id}')">🔁 再練一次</button>
    </div>
    ${has?`<div class="recinfo">🕒 我的錄音 ${recLabel(recMeta[u])} · <button class="linkbtn" onclick="deleteRec('${dayId}','${id}')">🗑 刪除錄音</button></div>`:""}`;
}
function stopPlayer(){if(player&&!player.paused){try{player.pause();player.currentTime=0;}catch(e){}}}
function clearTimers(s){s.timers.forEach(t=>{clearTimeout(t);clearInterval(t);});s.timers=[];}
function stopShadow(){
  stopPlayer();
  if(!cur)return;
  const s=cur;cur=null;
  s.cancelled=true;
  clearTimers(s);
  ttsStop();
  if(s.rec&&s.rec.state!=="inactive"){s.discard=true;try{s.rec.stop();}catch(e){}}
  if(s.meter){try{s.meter.stop();}catch(e){}s.meter=null;}
  const b=document.getElementById("sh-btn-"+s.u);if(b){b.classList.remove("rec");b.textContent="🔊 跟讀";b.onclick=()=>shadow(s.dayId,s.id);}
  setPhase(panel(s.u),recordings[s.u]?"done":"",shadowDoneHTML(s.dayId,s.id));
}
// ---- Speech (model voice) ----
function ttsBusy(){return !!TTS&&(TTS.speaking||TTS.pending);}
function ttsStop(){if(ttsBusy()){try{TTS.cancel();}catch(e){}}}   // iOS: cancel() on an idle engine delays the next speak()
let speakGen=0;
// Speak right now, in the same tick as the tap. Watchdog: iOS sometimes swallows a speak() that
// follows cancel(); if nothing started after 300ms, re-issue once.
function speakNow(texts,o){
  o=o||{};
  const gen=++speakGen;let bId=0,started=false,ended=false;
  const build=()=>{
    const my=++bId;
    keepUtts=texts.map(t=>{const u=new SpeechSynthesisUtterance(t);u.lang="en-US";if(enVoice)u.voice=enVoice;u.rate=o.rate||0.9;u.pitch=1;return u;});
    const first=keepUtts[0],last=keepUtts[keepUtts.length-1];
    const live=()=>gen===speakGen&&my===bId;
    first.onstart=()=>{if(!live()||started)return;started=true;o.onStart&&o.onStart();};
    last.onend=()=>{if(!live()||ended)return;ended=true;o.onEnd&&o.onEnd(true);};
    last.onerror=()=>{if(!live()||ended)return;ended=true;o.onEnd&&o.onEnd(false);};
    keepUtts.forEach(u=>TTS.speak(u));
  };
  ttsStop();
  if(TTS.paused){try{TTS.resume();}catch(e){}}
  build();
  const wd=setTimeout(()=>{
    if(gen!==speakGen||started||ended||TTS.speaking)return;
    bId++;try{TTS.cancel();}catch(e){}
    build();
  },300);
  if(o.timers)o.timers.push(wd);
}
// Speak the model; onDone(measuredSeconds|null, spoke) is called once.
function speakModel(s,texts,onDone){
  const est=wordCount(texts)/2.5/0.9+0.6;
  if(!TTS||!window.SpeechSynthesisUtterance){s.timers.push(setTimeout(()=>onDone(null,false),0));return;}
  let started=0,finished=false;
  const finish=real=>{if(finished||s.cancelled)return;finished=true;
    const d=started?(Date.now()-started)/1000:0;
    onDone(real&&d>0.4&&d<est*3?d:null,true);};
  speakNow(texts,{timers:s.timers,onStart(){started=Date.now();},onEnd:finish});
  s.timers.push(setTimeout(()=>finish(false),(est*2.2+4)*1000));   // some iOS versions skip onend
}
function shadow(dayId,id){
  const [d,it]=find(dayId,id),texts=modelTexts(it),u=uid(dayId,id);
  stopShadow();   // synchronous: pause <audio>, stop recorder; no awaits
  const s={dayId,id,u,timers:[],cancelled:false,rec:null,stream:null,chunks:[],micP:null};
  cur=s;
  // 1) Model voice FIRST, same tick as the tap (nothing awaited before it).
  speakModel(s,texts,(measured,spoke)=>{
    if(s.cancelled)return;
    const note=spoke?"":"（這個瀏覽器不能播放語音，請看上面的句子唸）";
    if(!CAN_REC){finishSession(s,"🙏 這個瀏覽器不支援錄音，可以先跟著唸幾次。建議用 iPhone 的 Safari 打開。"+note);return;}
    startRecording(s,it,recWindow(texts,measured));
  });
  // 2) Then the rest, without blocking speech.
  ensureAudioCtx();   // create/resume inside the tap (iOS); no-op when already running
  // Mic in parallel while the model plays — only when a stream is already held (no prompt, no
  // audio-session switch mid-speech). The very first round asks after the model finishes.
  if(CAN_REC&&micLive(micStream)){s.micP=freshMic();s.micP.catch(()=>{});}
  const b=document.getElementById("sh-btn-"+u);
  if(b){b.classList.add("rec");b.textContent="⏹ 停止";b.onclick=()=>{if(cur===s)stopShadow();else shadow(dayId,id);};}
  setPhase(panel(u),"listen",`<div class="st"><span class="ph">🔊 聽</span><b>先聽標準發音，先不要唸</b></div>${modelsHTML(it)}`);
}
function finishSession(s,note,ok){
  clearTimers(s);
  if(cur===s)cur=null;
  const b=document.getElementById("sh-btn-"+s.u);
  if(b){b.classList.remove("rec");b.textContent="🔊 跟讀";b.onclick=()=>shadow(s.dayId,s.id);}
  setPhase(panel(s.u),ok?"done":"warn",shadowDoneHTML(s.dayId,s.id,note));
}
const SILENT_PEAK=0.02;   // below this the whole recording was effectively silent
const READY_MS=600;       // minimum length of the 準備 3-2-1 cue
function startRecording(s,it,secs){
  const readyAt=Date.now();
  setPhase(panel(s.u),"ready",`<div class="st"><span class="ph" id="rd-${s.u}">準備… 3</span><span class="hint">紅燈亮就開始唸 · 這句錄 ${secs} 秒</span></div>${modelsHTML(it)}`);
  let k=3;
  s.timers.push(setInterval(()=>{k=Math.max(1,k-1);const el=document.getElementById("rd-"+s.u);if(el)el.textContent="準備… "+k;},READY_MS/3));
  const micReady=s.micP?s.micP.then(st=>micLive(st)?st:freshMic(),()=>freshMic()):freshMic();
  micReady.then(stream=>{
    if(s.cancelled)return;
    s.stream=stream;
    const mt=mimePick();
    let rec;
    try{rec=mt?new MediaRecorder(stream,{mimeType:mt}):new MediaRecorder(stream);}
    catch(e){try{rec=new MediaRecorder(stream);}catch(e2){finishSession(s,"🙏 這個瀏覽器不支援錄音，可以先跟著唸幾次。");return;}}
    s.rec=rec;
    s.meter=startMeter(stream);
    rec.ondataavailable=e=>{if(e.data&&e.data.size>0)s.chunks.push(e.data);};
    rec.onstop=()=>{
      const lvl=s.meter?s.meter.stop():null;s.meter=null;
      if(s.discard)return;
      const bytes=s.chunks.reduce((n,c)=>n+c.size,0);
      const silent=(lvl&&lvl.samples>=5)?lvl.peak<SILENT_PEAK:bytes<1500;   // trust the meter only if it ran
      if(!s.chunks.length||silent){
        freshMic().catch(()=>{});   // new capture now (holder is live → no prompt) so the next try works
        finishSession(s,"🎙️ 剛剛沒錄到聲音，請按 🔁 再練一次");
        return;
      }
      const blob=new Blob(s.chunks,{type:rec.mimeType||mt||"audio/mp4"});
      if(recordings[s.u])URL.revokeObjectURL(recordings[s.u]);
      recordings[s.u]=URL.createObjectURL(blob);
      recMeta[s.u]=Date.now();
      saveRec(s.dayId,s.id,blob,blob.type,recMeta[s.u]);
      finishSession(s,'<span class="ph">✅ 錄好了</span> 聽聽看自己唸的，跟標準比一比。',true);
      quizMark(s.dayId,s.id,"practiced");
    };
    // Recorder must be running BEFORE the red state, so the first syllable isn't cut.
    let went=false;
    const go=()=>{if(went||s.cancelled)return;went=true;
      s.timers.push(setTimeout(()=>beginRedPhase(s,it,secs),Math.max(0,READY_MS-(Date.now()-readyAt))));};
    rec.onstart=go;
    try{rec.start(250);}catch(e){try{rec.start();}catch(e2){finishSession(s,"🎙️ 剛剛沒錄到聲音，請按 🔁 再練一次");return;}}
    s.timers.push(setTimeout(go,1200));   // fallback if 'start' never fires
  }).catch(err=>{
    if(s.cancelled)return;
    const denied=err&&(err.name==="NotAllowedError"||err.name==="SecurityError");
    finishSession(s,denied
      ?"🎙️ 麥克風沒有被允許。請到 iPhone「設定 → Safari → 麥克風」改成「允許」，或在網址列左邊的「大小」選單允許麥克風，然後按 🔁 再練一次。"
      :"🎙️ 打不開麥克風（"+esc(err&&err.name||"error")+"），請再試一次。");
  });
}
function beginRedPhase(s,it,secs){
  if(s.cancelled)return;
  clearTimers(s);   // ends the 3-2-1 ticker
  const p=panel(s.u);
  setPhase(p,"rec",`<div class="st"><span class="dot"></span><span class="turn">🔴 換你唸</span>
      <span class="cd" id="cd-${s.u}">${secs.toFixed(1)}s</span>
      <button class="btn stop" id="stop-${s.u}">停止</button></div>
    ${modelsHTML(it)}
    <div class="tbar"><div id="tb-${s.u}"></div></div>`);
  const sb=document.getElementById("stop-"+s.u);if(sb)sb.onclick=()=>stopRecording(s);
  const t0=Date.now(),tb=document.getElementById("tb-"+s.u);
  if(tb){tb.style.transition="none";tb.style.width="100%";void tb.offsetWidth;
    tb.style.transition=`width ${secs}s linear`;tb.style.width="0%";}   // bar runs exactly the window
  s.timers.push(setInterval(()=>{
    const r=Math.max(0,secs-(Date.now()-t0)/1000),cd=document.getElementById("cd-"+s.u);
    if(cd)cd.textContent=r.toFixed(1)+"s";
  },100));
  s.timers.push(setTimeout(()=>stopRecording(s),secs*1000));
}
function stopRecording(s){
  if(s.cancelled||!s.rec||s.rec.state==="inactive")return;
  clearTimers(s);
  const cd=document.getElementById("cd-"+s.u);if(cd)cd.textContent="0.0s";
  try{s.rec.stop();}catch(e){finishSession(s,"🎙️ 剛剛沒錄到聲音，請按 🔁 再練一次");}
}
function playMine(dayId,id){
  const u=uid(dayId,id),url=recordings[u];if(!url)return;
  if(cur)stopShadow();
  ttsStop();
  if(!player){player=document.createElement("audio");player.setAttribute("playsinline","");player.preload="auto";document.body.appendChild(player);}
  stopPlayer();
  player.src=url;
  const pr=player.play();
  if(pr&&pr.catch)pr.catch(()=>{const p=panel(u);if(p)p.insertAdjacentHTML("afterbegin",'<div class="hint">播放失敗，再按一次試試。</div>');});
}
function replayModel(dayId,id){
  const [d,it]=find(dayId,id);
  if(cur)stopShadow();
  stopPlayer();
  if(!TTS||!window.SpeechSynthesisUtterance)return;
  speakNow(modelTexts(it));
}

window.addEventListener("hashchange",route);
route();
loadRecs();
</script>

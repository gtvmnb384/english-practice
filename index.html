<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="app-version" content="2026-11-04d">
<title>My English Practice</title>
<style>
:root{--bg:#fdf6ec;--card:#fff;--ink:#3b2f2a;--accent:#e07a5f;--accent2:#81b29a;--muted:#8a7b72;--line:#f0e2d0}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
header{background:linear-gradient(135deg,#f2a07b,#e07a5f);color:#fff;padding:24px 20px 20px;text-align:center}
header h1{margin:0;font-size:1.7rem}
header p{margin:6px 0 0;opacity:.95}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:14px;padding:16px 18px;margin:12px 0;box-shadow:0 2px 8px rgba(120,80,40,.07);border:1px solid var(--line)}
.day{display:block;text-decoration:none;color:var(--ink);cursor:pointer}
.day h2{margin:0 0 4px;font-size:1.25rem}
.day .meta{color:var(--muted);font-size:.9rem}
.bar{height:10px;background:#f3e6d6;border-radius:999px;overflow:hidden;margin-top:8px}
.bar>div{height:100%;background:var(--accent2);transition:width .4s}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
nav button,.back{border:none;background:#fff;color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08);font-size:.95rem}
nav button.on{background:var(--accent);color:#fff}
.topic{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.q{font-size:1.08rem;margin:6px 0 8px}
.hint{font-size:.88rem;color:var(--muted)}
input[type=text]{width:100%;padding:10px 12px;border:1px solid #e3d3bf;border-radius:10px;font-size:1rem;font-family:inherit;margin-top:6px}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn{border:none;background:var(--accent);color:#fff;padding:9px 14px;border-radius:10px;cursor:pointer;font-size:.95rem}
.btn.mic{background:var(--accent2)}.btn.mic.rec{background:#c0392b}
.shadow{margin-top:10px;padding:12px 14px;border-radius:12px;background:#fbf1e4;border:1px dashed #ecd2b4;font-size:.95rem}
.shadow:empty{display:none}
.shadow .model{font-weight:600;margin:4px 0 2px}
.shadow .st{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.shadow .turn{color:#c0392b;font-weight:700;font-size:1.05rem}
.shadow .cd{font-variant-numeric:tabular-nums;background:#fff;border-radius:999px;padding:1px 10px;font-weight:700;color:#c0392b}
.dot{width:12px;height:12px;border-radius:50%;background:#c0392b;display:inline-block;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
.tbar{height:6px;background:#f3d6cc;border-radius:999px;overflow:hidden;margin-top:8px}
.tbar>div{height:100%;background:#c0392b;width:100%}
.shadow .btn{font-size:.9rem;padding:8px 12px}
.btn.stop{background:#c0392b}
.btn.ghost{background:#f3e6d6;color:var(--ink)}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;display:none;font-size:.95rem}
.fb.ok{background:#e6f3ec;color:#2f6b4f;display:block}
.fb.no{background:#fdeae4;color:#9a3d22;display:block}
.card.item.checked{border:2px solid #4caf7d;background:#f6fcf8}
.done-badge{float:right;background:#4caf7d;color:#fff;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700}
.chkrow{border-top:1px dashed var(--line);padding-top:10px;margin-top:12px}
.btn.chk{background:#fff;color:#2f6b4f;border:2px solid #4caf7d;font-weight:700}
.btn.chk.on{background:#4caf7d;color:#fff}
.quizbtn{display:block;width:100%;border:none;border-radius:16px;padding:18px 16px;margin:8px 0 14px;font-size:1.35rem;font-weight:800;color:#fff;cursor:pointer;background:linear-gradient(135deg,#6c8cd5,#8e6bd1);box-shadow:0 4px 12px rgba(90,80,180,.25)}
.quizbtn small{display:block;font-size:.85rem;font-weight:400;opacity:.92;margin-top:4px}
.day.alldone{border:2px solid #4caf7d}
.party{float:right;background:#fff3c4;color:#8a6100;border-radius:999px;padding:2px 10px;font-size:.85rem;font-weight:700}
.datetag{float:right;background:#eef2fb;color:#4a5f99;border-radius:999px;padding:2px 10px;font-size:.78rem}
.qstat{float:right;margin-right:6px;background:#e6f3ec;color:#2f6b4f;border-radius:999px;padding:2px 10px;font-size:.78rem}
.summary{border:2px solid #8e6bd1;text-align:center}
.summary h3{margin:0 0 6px}
.shadow .ph{font-weight:800;border-radius:999px;padding:2px 12px;color:#fff;background:#888}
.shadow.ph-listen{background:#eaf2fd;border:2px solid #4a7fd4}
.shadow.ph-listen .ph{background:#4a7fd4}
.shadow.ph-ready{background:#fff6dc;border:2px solid #e0a800}
.shadow.ph-ready .ph{background:#e0a800;font-size:1.1rem}
.shadow.ph-rec{background:#fdecea;border:2px solid #c0392b}
.shadow.ph-done{background:#e9f6ee;border:2px solid #4caf7d}
.shadow.ph-done .ph{background:#4caf7d}
.shadow.ph-warn{background:#fff4ec;border:2px solid #e07a5f}
.blank{display:inline-block;min-width:60px;border-bottom:2px dashed var(--accent);margin:0 3px}
.hidden{display:none}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:24px}
</style>
</head>
<body>
<header>
  <h1>☕ My English Practice</h1>
  <p>A little practice every day goes a long way. 加油！</p>
</header>
<div class="wrap" id="app"></div>
<footer>Progress is saved in this browser only · 🔊 跟讀：先聽標準發音，再錄自己的聲音 · <span id="appver" style="opacity:.6"></span></footer>
<script>
// Bump BOTH this constant and the <meta name="app-version"> tag on every release.
const APP_VERSION = "2026-11-04d";
(function(){
  var el=document.getElementById('appver'); if(el) el.textContent='v'+APP_VERSION;
  var busy=false;
  function toast(msg){var t=document.createElement('div');t.textContent=msg;
    t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 16px;border-radius:20px;font-size:.9rem;z-index:9999;opacity:.92';
    document.body.appendChild(t);}
  function check(){
    if(busy) return; busy=true;
    fetch(location.pathname+'?check='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():'';}).then(function(html){
      var m=html.match(/<meta\s+name=["']app-version["']\s+content=["']([^"']+)["']/i);
      if(!m) return; var remote=m[1];
      if(remote===APP_VERSION) return;
      try{ if(sessionStorage.getItem('app-update-attempt')===remote) return;
        sessionStorage.setItem('app-update-attempt',remote);}catch(e){}
      toast('有新版本，更新中…');
      setTimeout(function(){location.replace(location.pathname+'?v='+encodeURIComponent(remote)+location.hash);},600);
    }).catch(function(){}).finally(function(){busy=false;});
  }
  window.addEventListener('load',check);
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')check();});
  window.addEventListener('pageshow',function(e){if(e.persisted)check();});
})();
// ===== Data: one entry per practice day =====
const DAYS=[
{
 id:"2026-11-03", label:"11/3 對話",
 topics:"Going downtown · Supermarket · Soup noodles at the hotel · Cooking in Europe vs eating out in Taiwan · Favorite Taiwanese food · Hot pot · Media freedom demonstration",
 vocab:[
  {id:"v1",zh:"短暫進去一下（店裡）",w:["popped into","pop into"],show:"popped into",ex:"I popped into the supermarket on my way home."},
  {id:"v2",zh:"我大概會說……",w:["i'd probably say","i would probably say"],show:"I'd probably say",ex:"I'd probably say beef noodle soup is my favorite."},
  {id:"v3",zh:"外食、在外面吃",w:["eating out","eat out"],show:"eating out",ex:"In Taiwan, eating out is really cheap."},
  {id:"v4",zh:"煮湯麵",w:["make soup noodles","made soup noodles"],show:"make soup noodles",ex:"I made soup noodles in the hotel kitchen."},
  {id:"v5",zh:"進城、去市區",w:["went into town","go into town","go downtown","went downtown"],show:"went into town",ex:"I went into town this afternoon."},
  {id:"v6",zh:"我沒聽懂那是關於什麼",w:["i didn't really catch what it was about","i didn't catch what it was about"],show:"I didn't really catch what it was about",ex:"There was a demonstration, but I didn't really catch what it was about."},
  {id:"v7",zh:"超市",w:["supermarket"],show:"supermarket",ex:"There's a big supermarket near my hotel."},
  {id:"v8",zh:"火鍋",w:["hot pot","hotpot"],show:"hot pot",ex:"Hot pot is perfect for cold weather."},
  {id:"v9",zh:"遊行、示威",w:["demonstration","protest"],show:"demonstration",ex:"There was a demonstration in the main square."},
  {id:"v10",zh:"新聞自由",w:["media freedom","press freedom","freedom of the press"],show:"media freedom",ex:"People were protesting for media freedom."},
  {id:"v11",zh:"自己在家煮飯",w:["cook at home"],show:"cook at home",ex:"In Europe I usually cook at home."},
  {id:"v12",zh:"想念",w:["miss"],show:"miss",ex:"Sometimes I really miss Taiwanese night markets."}
 ],
 sentences:[
  {id:"d1",t:"Going downtown",type:"fill",q:"Today I ___ to walk around the old square.",hint:"去市區（3 個字）",a:["went into town"],show:"Today I went into town to walk around the old square."},
  {id:"d2",t:"Going downtown",type:"fix",q:"Today I go to downtown with my friend.",hint:"時態，downtown 前不用 to",a:["today i went downtown with my friend","today i went into town with my friend"],show:"Today I went downtown with my friend."},
  {id:"s1",t:"Supermarket shopping",type:"fill",q:"On the way back, I ___ the supermarket to buy some eggs.",hint:"短暫進去一下（2 個字）",a:["popped into"],show:"On the way back, I popped into the supermarket to buy some eggs."},
  {id:"s2",t:"Supermarket shopping",type:"fix",q:"I go to supermarket and buy many vegetable.",hint:"時態、冠詞、複數",a:["i went to the supermarket and bought a lot of vegetables","i went to the supermarket and bought lots of vegetables","i went to the supermarket and bought many vegetables"],show:"I went to the supermarket and bought a lot of vegetables."},
  {id:"h1",t:"Cooking at the hotel",type:"fill",q:"There's a small kitchen in my hotel, so I ___ soup noodles for dinner.",hint:"煮湯麵用哪個動詞？（過去式）",a:["made"],show:"There's a small kitchen in my hotel, so I made soup noodles for dinner."},
  {id:"h2",t:"Cooking at the hotel",type:"fix",q:"I cook a soup noodle in the hotel.",hint:"make soup noodles，時態",a:["i made soup noodles in the hotel","i made soup noodles at the hotel","i made some soup noodles at the hotel","i made some soup noodles in the hotel"],show:"I made soup noodles at the hotel."},
  {id:"e1",t:"Europe vs Taiwan",type:"fill",q:"In Taiwan, ___ is really cheap, but in Europe I usually cook at home.",hint:"外食（2 個字）",a:["eating out"],show:"In Taiwan, eating out is really cheap, but in Europe I usually cook at home."},
  {id:"e2",t:"Europe vs Taiwan",type:"fix",q:"In Europe the restaurant is too expensive, so I must cook by myself in home.",hint:"泛指用複數；at home",a:["in europe restaurants are too expensive so i have to cook at home","in europe eating out is too expensive so i have to cook at home","in europe restaurants are so expensive that i have to cook at home"],show:"In Europe, restaurants are too expensive, so I have to cook at home."},
  {id:"f1",t:"Favorite food in Taiwan",type:"fill",q:"If I had to pick one, ___ beef noodle soup.",hint:"委婉說「我大概會說」",a:["i'd probably say","i would probably say"],show:"If I had to pick one, I'd probably say beef noodle soup."},
  {id:"f2",t:"Favorite food in Taiwan",type:"fix",q:"My most favorite food in Taiwan is the hot pot.",hint:"favorite 本身就是最高級；hot pot 不加 the",a:["my favorite food in taiwan is hot pot"],show:"My favorite food in Taiwan is hot pot."},
  {id:"p1",t:"Hot pot",type:"fill",q:"In winter, my friends and I love to ___ hot pot together.",hint:"吃火鍋的常見動詞",a:["have","eat"],show:"In winter, my friends and I love to have hot pot together."},
  {id:"p2",t:"Hot pot",type:"fix",q:"Hot pot is very popular in Taiwan, especially when the weather is cold, everyone like to eat it.",hint:"兩個子句分開；everyone 是單數",a:["hot pot is very popular in taiwan especially when the weather is cold everyone likes it","hot pot is very popular in taiwan especially when the weather is cold everyone likes to eat it"],show:"Hot pot is very popular in Taiwan, especially when the weather is cold. Everyone likes it."},
  {id:"m1",t:"Media freedom demonstration",type:"fill",q:"In the square there was a ___ about media freedom.",hint:"遊行、示威（一個字）",a:["demonstration","protest"],show:"In the square there was a demonstration about media freedom."},
  {id:"m2",t:"Media freedom demonstration",type:"fix",q:"I saw many people in the street for protest the media freedom.",hint:"protesting for ...",a:["i saw a lot of people in the street protesting for media freedom","i saw many people in the street protesting for media freedom","i saw lots of people in the street protesting for media freedom"],show:"I saw a lot of people in the street protesting for media freedom."},
  {id:"c1",t:"Not understanding the demonstration",type:"fill",q:"Everyone was shouting in Czech, so I didn't really ___ what it was about.",hint:"聽懂、抓到（一個字）",a:["catch"],show:"Everyone was shouting in Czech, so I didn't really catch what it was about."},
  {id:"c2",t:"Not understanding the demonstration",type:"fix",q:"I don't understand what is the demonstration about.",hint:"間接問句語序和時態",a:["i didn't understand what the demonstration was about","i didn't really catch what the demonstration was about","i didn't really catch what it was about"],show:"I didn't really catch what the demonstration was about."},
  {id:"x1",t:"Bonus: Work",type:"fix",q:"I am work as a part-time consultant until December.",hint:"am 和 work 不能同時用",a:["i work as a part-time consultant until december","i'm working as a part-time consultant until december","i am working as a part-time consultant until december"],show:"I'm working as a part-time consultant until December."},
  {id:"x2",t:"Bonus: Weather",type:"fill",q:"It's getting really cold here. I need to ___ a warmer jacket.",hint:"買到、入手（pick ...）",a:["pick up"],show:"It's getting really cold here. I need to pick up a warmer jacket."},
  {id:"x3",t:"Bonus: Transport",type:"fix",q:"I take the tram to arrive the city center.",hint:"get to 或直接 to",a:["i take the tram to get to the city center","i took the tram to get to the city center","i take the tram to the city center","i took the tram to the city center"],show:"I take the tram to get to the city center."},
  {id:"x4",t:"Bonus: Missing home",type:"fill",q:"Sometimes I really ___ Taiwanese night markets.",hint:"想念（一個字）",a:["miss"],show:"Sometimes I really miss Taiwanese night markets."},
  {id:"x5",t:"Bonus: Small talk",type:"fix",q:"How long time you stay in Europe?",hint:"How long have you ...",a:["how long have you been in europe","how long have you stayed in europe","how long are you staying in europe","how long will you stay in europe"],show:"How long have you been in Europe?"},
  {id:"x6",t:"Bonus: Ordering food",type:"fill",q:"Could I ___ the soup of the day, please?",hint:"點餐常用（一個字）",a:["have","get"],show:"Could I have the soup of the day, please?"}
 ]
}
];

// ===== State =====
const KEY="english-progress-v2";        // legacy: auto-"done" set by Check (before v2026-11-04d)
const CKEY="english-checked-v1";        // ✅ 完成 check-offs = daily task status
let checked={};
try{
  const raw=localStorage.getItem(CKEY);
  if(raw!==null)checked=JSON.parse(raw)||{};
  else{checked=JSON.parse(localStorage.getItem(KEY)||"{}")||{};localStorage.setItem(CKEY,JSON.stringify(checked));}  // migrate old done → checked
}catch(e){}
function save(){try{localStorage.setItem(CKEY,JSON.stringify(checked));}catch(e){}}
const app=document.getElementById("app");
let tab="vocab";
let view="home";
let quiz=null;   // {list:[{dayId,id}], res:{uid:"ok"|"shown"|"practiced"}}

function norm(s){return s.toLowerCase().replace(/[’]/g,"'").replace(/[.,!?;:"“”]/g," ").replace(/\s+/g," ").trim();}
function items(day){return day.vocab.map(v=>({...v,kind:"vocab"})).concat(day.sentences.map(s=>({...s,kind:"sent"})));}
function key(day,id){return day.id+"/"+id;}
function uid(dayId,id){return (dayId+"_"+id).replace(/[^\w-]/g,"_");}
function dayById(id){return DAYS.find(d=>d.id===id);}
function countDone(day,kind){return items(day).filter(i=>(!kind||i.kind===kind)&&checked[key(day,i.id)]).length;}
function dayStats(d){const nv=countDone(d,"vocab"),ns=countDone(d,"sent"),total=d.vocab.length+d.sentences.length;return {nv,ns,n:nv+ns,total,all:total>0&&nv+ns===total};}

// ===== Views =====
function route(){
  stopShadow();
  const h=decodeURIComponent(location.hash.slice(1));
  if(h==="quiz"){if(!quiz)newQuiz();renderQuiz();}
  else{const day=dayById(h);day?renderDay(day):renderHome();}
  window.scrollTo(0,0);
}
function renderHome(){
  view="home";quiz=null;
  const nSent=DAYS.reduce((n,d)=>n+d.sentences.length,0);
  app.innerHTML=`<button class="quizbtn" id="quiz-btn" onclick="startQuiz()">🎲 隨機測驗<small>從所有日期隨機抽 ${Math.min(5,nSent)} 個句子來練習</small></button>
  <h2 style="margin:8px 4px">練習日期</h2>`+DAYS.slice().reverse().map(d=>{
    const st=dayStats(d);
    return `<a class="card day ${st.all?'alldone':''}" href="#${d.id}">${st.all?'<span class="party">🎉 完成</span>':''}<h2>📅 ${d.label}</h2>
      <div class="meta">${d.topics}</div>
      <div class="meta">✅ 單字 ${st.nv}/${d.vocab.length} · 語句 ${st.ns}/${d.sentences.length}</div>
      <div class="bar"><div style="width:${st.n/st.total*100}%"></div></div></a>`;}).join("");
}
function cardHTML(day,it,opt){
  opt=opt||{};
  const u=uid(day.id,it.id),isChk=!opt.quiz&&!!checked[key(day,it.id)];
  let head,q,ph;
  if(it.kind==="vocab"){head="中文 → English";q=it.zh;ph="Type the English";}
  else{head=it.t+" · "+(it.type==="fill"?"Fill in the blank":"Fix the sentence");
    q=it.type==="fill"?it.q.replace(/___/g,'<span class="blank"></span>'):"“"+it.q+"”";
    ph=it.type==="fill"?"Type the missing words":"Type the corrected sentence";}
  return `<div class="card item ${isChk?'checked':''}" id="card-${u}">
    ${opt.quiz?`<span class="datetag">📅 ${day.label}</span><span class="qstat hidden" id="qs-${u}"></span>`
      :`<span id="badge-${u}" class="done-badge ${isChk?'':'hidden'}">✓ 已完成</span>`}
    <div class="topic">${opt.quiz?`第 ${opt.num} 題 · `:""}${head}</div>
    <div class="q">${q}</div>
    ${it.hint?`<div class="hint">Hint: ${it.hint}</div>`:""}
    <input type="text" id="in-${u}" placeholder="${ph}" autocomplete="off" autocapitalize="off" onkeydown="if(event.key==='Enter')check('${day.id}','${it.id}')">
    <div class="row">
      <button class="btn" onclick="check('${day.id}','${it.id}')">Check</button>
      <button class="btn mic" id="sh-btn-${u}" onclick="shadow('${day.id}','${it.id}')">🔊 跟讀</button>
      <button class="btn ghost" onclick="reveal('${day.id}','${it.id}')">Show answer</button>
    </div>
    <div class="fb" id="fb-${u}"></div>
    <div class="shadow${recordings[u]?' ph-done':''}" id="sh-${u}">${shadowDoneHTML(day.id,it.id)}</div>
    ${opt.quiz?"":`<div class="row chkrow"><button class="btn chk ${isChk?'on':''}" id="chk-${u}" onclick="toggleCheck('${day.id}','${it.id}')">${chkLabel(isChk)}</button></div>`}
  </div>`;
}
function chkLabel(on){return on?"✓ 已完成（點一下取消）":"✅ 完成";}
function renderDay(day){
  view="day";
  stopShadow();
  const list=tab==="vocab"?day.vocab.map(v=>({...v,kind:"vocab"})):day.sentences.map(s=>({...s,kind:"sent"}));
  let html=`<div class="row"><button class="back" onclick="location.hash=''">← 所有日期</button></div>
  <h2 style="margin:12px 4px 0">📅 ${day.label}</h2>
  <nav><button id="tab-vocab" class="${tab==='vocab'?'on':''}" onclick="tab='vocab';renderDay(dayById('${day.id}'))"></button>
  <button id="tab-sent" class="${tab==='sent'?'on':''}" onclick="tab='sent';renderDay(dayById('${day.id}'))"></button></nav>
  <div class="card"><strong>今日任務：${tab==='vocab'?'單字':'語句練習'}</strong> — <span id="sec-n"></span>
  <div class="bar"><div id="sec-bar"></div></div><div class="hint" id="sec-msg">覺得這題沒問題了，就按卡片下方的 ✅ 完成 勾起來。</div></div>`;
  html+=list.map(it=>cardHTML(day,it)).join("");
  html+=`<div class="row"><button class="btn ghost" onclick="resetDay('${day.id}')">重設這一天的勾選</button></div>`;
  app.innerHTML=html;
  updateDayCounts(day);
}
function updateDayCounts(day){
  const st=dayStats(day);
  const tv=document.getElementById("tab-vocab"),ts=document.getElementById("tab-sent");
  if(tv)tv.textContent=`單字 ${st.nv}/${day.vocab.length}`;
  if(ts)ts.textContent=`語句練習 ${st.ns}/${day.sentences.length}`;
  const tot=tab==="vocab"?day.vocab.length:day.sentences.length,n=tab==="vocab"?st.nv:st.ns;
  const sn=document.getElementById("sec-n"),sb=document.getElementById("sec-bar"),sm=document.getElementById("sec-msg");
  if(sn)sn.textContent=`${n} / ${tot}`;
  if(sb)sb.style.width=(tot?n/tot*100:0)+"%";
  if(sm&&st.all)sm.textContent="🎉 這一天的單字和語句全部完成了！";
  else if(sm&&n===tot&&tot)sm.textContent="👍 這一區全部完成！換另一個分頁繼續。";
}
function toggleCheck(dayId,id){
  const d=dayById(dayId),k=key(d,id),u=uid(dayId,id);
  if(checked[k])delete checked[k];else checked[k]=true;
  save();
  const on=!!checked[k];
  const card=document.getElementById("card-"+u),badge=document.getElementById("badge-"+u),btn=document.getElementById("chk-"+u);
  if(card)card.classList.toggle("checked",on);
  if(badge)badge.classList.toggle("hidden",!on);
  if(btn){btn.classList.toggle("on",on);btn.textContent=chkLabel(on);}
  updateDayCounts(d);
}

// ===== Random quiz =====
function newQuiz(){
  const pool=[];DAYS.forEach(d=>d.sentences.forEach(s=>pool.push({dayId:d.id,id:s.id})));
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  quiz={list:pool.slice(0,5),res:{}};
}
function startQuiz(){newQuiz();if(location.hash==="#quiz")route();else location.hash="quiz";}
function renderQuiz(){
  view="quiz";
  const n=quiz.list.length;
  let html=`<div class="row"><button class="back" onclick="location.hash=''">← 回首頁</button></div>
  <h2 style="margin:12px 4px 0">🎲 隨機測驗</h2>
  <div class="card"><strong>測驗進度</strong> — <span id="qprog">0 / ${n}</span>
  <div class="bar"><div id="qbar" style="width:0"></div></div>
  <div class="hint">每題答對、看答案或跟讀錄完就算練習過。測驗結果不會影響每日的 ✅ 勾選。</div></div>`;
  html+=quiz.list.map((q,i)=>{const d=dayById(q.dayId);const it=items(d).find(x=>x.kind==="sent"&&x.id===q.id);return cardHTML(d,it,{quiz:true,num:i+1});}).join("");
  html+=`<div id="qsum"></div>`;
  app.innerHTML=html;
  updateQuizProgress();
}
const QRANK={practiced:1,shown:2,ok:3};
function quizMark(dayId,id,r){
  if(view!=="quiz"||!quiz)return;
  if(!quiz.list.some(q=>q.dayId===dayId&&q.id===id))return;
  const u=uid(dayId,id),prev=quiz.res[u];
  // "shown" before a correct answer still counts as shown
  if(prev==="shown"&&r==="ok")return;
  if(!prev||QRANK[r]>QRANK[prev])quiz.res[u]=r;
  const tag=document.getElementById("qs-"+u);
  if(tag){tag.classList.remove("hidden");tag.textContent={ok:"✓ 答對",shown:"💡 看過答案",practiced:"🔊 跟讀過"}[quiz.res[u]];}
  updateQuizProgress();
}
function updateQuizProgress(){
  if(view!=="quiz"||!quiz)return;
  const n=quiz.list.length,vals=Object.values(quiz.res),k=vals.length;
  const pg=document.getElementById("qprog"),bar=document.getElementById("qbar"),sum=document.getElementById("qsum");
  if(pg)pg.textContent=`${k} / ${n}`;
  if(bar)bar.style.width=(n?k/n*100:0)+"%";
  if(!sum)return;
  const btns=`<div class="row"><button class="btn" onclick="startQuiz()">🎲 再抽五題</button><button class="btn ghost" onclick="location.hash=''">🏠 回首頁</button></div>`;
  if(k>=n){
    const c=r=>vals.filter(v=>v===r).length;
    sum.innerHTML=`<div class="card summary"><h3>🎉 這組測驗完成！</h3>
      <div>✍️ 自己答對 <b>${c("ok")}</b> 題 · 💡 看答案 <b>${c("shown")}</b> 題 · 🔊 只跟讀 <b>${c("practiced")}</b> 題</div>${btns}</div>`;
  }else sum.innerHTML=btns;
}

// ===== Actions =====
function find(dayId,id){const d=dayById(dayId);return [d,items(d).find(i=>i.id===id)];}
function answerOf(it){return it.kind==="vocab"?it.w:it.a;}
function shown(it){return it.kind==="vocab"?`<b>${it.show}</b><br><span class="hint">${it.ex}</span>`:`<b>${it.show}</b>`;}
// Self-test only: does NOT mark the item as done (use ✅ 完成 for that).
function check(dayId,id){
  const [d,it]=find(dayId,id),u=uid(dayId,id);
  const v=norm(document.getElementById("in-"+u).value),fb=document.getElementById("fb-"+u);
  if(!v){fb.className="fb no";fb.textContent="Type your answer first 🙂";return false;}
  const full=it.kind==="vocab"?norm(it.ex):norm(it.show);
  const ok=answerOf(it).some(a=>norm(a)===v)||full===v;
  if(ok){fb.className="fb ok";fb.innerHTML="✅ Nice!<br>"+shown(it)+(view==="day"&&!checked[key(d,id)]?'<div class="hint">覺得沒問題就按下方 ✅ 完成 勾起來。</div>':"");quizMark(dayId,id,"ok");}
  else{fb.className="fb no";fb.innerHTML="Not quite. Try again, or tap “Show answer”.";}
  return ok;
}
function reveal(dayId,id){const [d,it]=find(dayId,id);const fb=document.getElementById("fb-"+uid(dayId,id));fb.className="fb ok";fb.innerHTML="💡 Answer:<br>"+shown(it);quizMark(dayId,id,"shown");}
function resetDay(dayId){if(!confirm("要清除這一天的 ✅ 完成勾選嗎？"))return;Object.keys(checked).forEach(k=>{if(k.startsWith(dayId+"/"))delete checked[k];});save();route();}

// ===== Shadowing (跟讀) =====
const TTS=window.speechSynthesis||null;
const CAN_REC=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
let enVoice=null;
function pickVoice(){
  if(!TTS)return;
  const vs=TTS.getVoices()||[];
  enVoice=vs.find(v=>v.lang==="en-US"&&/samantha|ava|allison|google us english/i.test(v.name))
    ||vs.find(v=>v.lang==="en-US"||v.lang==="en_US")||vs.find(v=>/^en/i.test(v.lang))||null;
}
if(TTS){pickVoice();if("onvoiceschanged" in TTS)TTS.onvoiceschanged=pickVoice;}
const recordings={};   // id -> blob URL of the user's last recording
let cur=null;          // the one active session
let keepUtts=[];       // keep utterances referenced (Safari GC bug)
let player=null;       // shared <audio> for playback

// ---- Mic: one permission prompt per app session, but a FRESH capture for every recording ----
// micStream is the "permission holder": while a live stream exists, iOS doesn't re-prompt.
// Each round calls getUserMedia again (no prompt, because the holder is live), records with the
// new stream, then that new stream becomes the holder and the previous one is stopped.
// This avoids iOS's silent/muted track after speechSynthesis or <audio> changes the audio session.
let micStream=null,micPending=null,micReleaseTimer=null;
function micLive(st){return !!st&&st.getAudioTracks().some(t=>t.readyState==="live"&&!t.muted);}
function stopStream(st){if(st)st.getTracks().forEach(t=>{try{t.stop();}catch(e){}});}
function releaseMic(){
  if(micReleaseTimer){clearTimeout(micReleaseTimer);micReleaseTimer=null;}
  if(cur&&cur.rec&&cur.rec.state!=="inactive")return;   // never cut an active recording
  stopStream(micStream);micStream=null;
}
// Returns a brand-new stream for this round and makes it the holder.
function freshMic(){
  if(micPending)return micPending;
  const old=micStream;
  micPending=navigator.mediaDevices.getUserMedia({audio:true}).then(st=>{
    micPending=null;
    micStream=st;
    if(old&&old!==st)stopStream(old);    // stop the old holder only after the new one is live
    return st;
  },err=>{micPending=null;throw err;});
  return micPending;
}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden"){
    if(!micReleaseTimer&&micStream)micReleaseTimer=setTimeout(()=>{micReleaseTimer=null;releaseMic();},60000);
  }else if(micReleaseTimer){clearTimeout(micReleaseTimer);micReleaseTimer=null;}
});
window.addEventListener("pagehide",()=>{if(cur)stopShadow();releaseMic();});

// ---- Level meter (safety net for silent recordings) ----
let actx=null;
function ensureAudioCtx(){   // call inside the user's tap so iOS allows it
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return null;
    if(!actx||actx.state==="closed")actx=new AC();
    if(actx.state==="suspended"&&actx.resume)actx.resume().catch(()=>{});
    return actx;
  }catch(e){return null;}
}
// Returns {stop():{peak,samples}} measuring peak deviation from silence (0..1).
function startMeter(stream){
  const m={peak:0,samples:0,src:null,an:null,iv:null};
  try{
    const ctx=ensureAudioCtx();
    if(!ctx)return null;
    m.src=ctx.createMediaStreamSource(stream);
    m.an=ctx.createAnalyser();m.an.fftSize=1024;
    m.src.connect(m.an);
    const buf=new Float32Array(m.an.fftSize);
    m.iv=setInterval(()=>{
      if(ctx.state!=="running")return;
      m.an.getFloatTimeDomainData(buf);
      let pk=0;for(let i=0;i<buf.length;i++){const v=Math.abs(buf[i]);if(v>pk)pk=v;}
      m.samples++;if(pk>m.peak)m.peak=pk;
    },50);
  }catch(e){return null;}
  return {stop(){clearInterval(m.iv);try{m.src&&m.src.disconnect();}catch(e){}return {peak:m.peak,samples:m.samples};}};
}

function modelTexts(it){return it.kind==="vocab"?[it.show].concat(it.ex?[it.ex]:[]):[it.show];}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function panel(u){return document.getElementById("sh-"+u);}
function setPhase(p,ph,html){if(!p)return;p.className="shadow"+(ph?" ph-"+ph:"");p.innerHTML=html;}
function modelsHTML(it){return modelTexts(it).map(t=>`<div class="model">${esc(t)}</div>`).join("");}
function mimePick(){
  if(!window.MediaRecorder||!MediaRecorder.isTypeSupported)return "";
  for(const t of ["audio/mp4","audio/webm;codecs=opus","audio/webm"])if(MediaRecorder.isTypeSupported(t))return t;
  return "";
}
// Recording window (seconds): scales with the words to say, optionally with the measured model duration.
function wordCount(texts){return [].concat(texts).join(" ").trim().split(/\s+/).filter(Boolean).length;}
function recWindow(texts,measured){
  const base=wordCount(texts)*0.45+1.2;
  let secs=base;
  // If we really measured the model speech, allow a bit longer for slow sentences, but never runaway.
  if(measured&&measured>0.4)secs=Math.max(base,Math.min(measured*1.25+0.8,base*1.6));
  return Math.round(Math.max(2.5,Math.min(15,secs))*10)/10;
}
function shadowDoneHTML(dayId,id,note){
  const u=uid(dayId,id),has=!!recordings[u];
  if(!has&&!note)return "";
  return `${note?`<div class="st" style="margin-bottom:6px">${note}</div>`:""}
    <div class="row" style="margin-top:0">
      ${has?`<button class="btn mic" onclick="playMine('${dayId}','${id}')">▶️ 聽我的錄音</button>`:""}
      <button class="btn ghost" onclick="replayModel('${dayId}','${id}')">🔊 再聽一次標準</button>
      <button class="btn" onclick="shadow('${dayId}','${id}')">🔁 再練一次</button>
    </div>`;
}
function stopPlayer(){if(player){try{player.pause();}catch(e){}}}
function clearTimers(s){s.timers.forEach(t=>{clearTimeout(t);clearInterval(t);});s.timers=[];}
function stopShadow(){
  stopPlayer();
  if(!cur)return;
  const s=cur;cur=null;
  s.cancelled=true;
  clearTimers(s);
  if(TTS){try{TTS.cancel();}catch(e){}}
  if(s.rec&&s.rec.state!=="inactive"){s.discard=true;try{s.rec.stop();}catch(e){}}
  if(s.meter){try{s.meter.stop();}catch(e){}s.meter=null;}
  const b=document.getElementById("sh-btn-"+s.u);if(b){b.classList.remove("rec");b.textContent="🔊 跟讀";b.onclick=()=>shadow(s.dayId,s.id);}
  setPhase(panel(s.u),recordings[s.u]?"done":"",shadowDoneHTML(s.dayId,s.id));
}
// Speak the model; onDone(measuredSeconds|null, spoke) is called once.
function speakModel(s,it,onDone){
  const texts=modelTexts(it);
  const est=wordCount(texts)/2.5/0.9+0.6;
  if(!TTS||!window.SpeechSynthesisUtterance){onDone(null,false);return;}
  try{TTS.cancel();}catch(e){}
  let started=0,finished=false;
  const finish=real=>{if(finished||s.cancelled)return;finished=true;
    const d=started?(Date.now()-started)/1000:0;
    onDone(real&&d>0.4&&d<est*3?d:null,true);};
  keepUtts=texts.map((t,i)=>{
    const u=new SpeechSynthesisUtterance(t);
    u.lang="en-US";if(enVoice)u.voice=enVoice;u.rate=0.9;u.pitch=1;
    if(i===0)u.onstart=()=>{started=Date.now();};
    if(i===texts.length-1){u.onend=()=>finish(true);u.onerror=()=>finish(false);}
    return u;
  });
  keepUtts.forEach(u=>TTS.speak(u));      // inside the tap handler (iOS needs this)
  s.timers.push(setTimeout(()=>finish(false),(est*2.2+4)*1000));   // some iOS versions skip onend
}
function shadow(dayId,id){
  const [d,it]=find(dayId,id);
  stopShadow();
  const u=uid(dayId,id);
  const s={dayId,id,u,timers:[],cancelled:false,rec:null,stream:null,chunks:[]};
  cur=s;
  ensureAudioCtx();   // create/resume inside the tap (iOS)
  const b=document.getElementById("sh-btn-"+u);
  if(b){b.classList.add("rec");b.textContent="⏹ 停止";b.onclick=()=>{if(cur===s)stopShadow();else shadow(dayId,id);};}
  setPhase(panel(u),"listen",`<div class="st"><span class="ph">🔊 聽</span><b>先聽標準發音，先不要唸</b></div>${modelsHTML(it)}`);
  speakModel(s,it,(measured,spoke)=>{
    if(s.cancelled)return;
    const note=spoke?"":"（這個瀏覽器不能播放語音，請看上面的句子唸）";
    if(!CAN_REC){finishSession(s,"🙏 這個瀏覽器不支援錄音，可以先跟著唸幾次。建議用 iPhone 的 Safari 打開。"+note);return;}
    startRecording(s,it,recWindow(modelTexts(it),measured));
  });
}
function finishSession(s,note,ok){
  clearTimers(s);
  if(cur===s)cur=null;
  const b=document.getElementById("sh-btn-"+s.u);
  if(b){b.classList.remove("rec");b.textContent="🔊 跟讀";b.onclick=()=>shadow(s.dayId,s.id);}
  setPhase(panel(s.u),ok?"done":"warn",shadowDoneHTML(s.dayId,s.id,note));
}
const SILENT_PEAK=0.02;   // below this the whole recording was effectively silent
const READY_MS=600;       // minimum length of the 準備 3-2-1 cue
function startRecording(s,it,secs){
  const readyAt=Date.now();
  setPhase(panel(s.u),"ready",`<div class="st"><span class="ph" id="rd-${s.u}">準備… 3</span><span class="hint">紅燈亮就開始唸 · 這句錄 ${secs} 秒</span></div>${modelsHTML(it)}`);
  let k=3;
  s.timers.push(setInterval(()=>{k=Math.max(1,k-1);const el=document.getElementById("rd-"+s.u);if(el)el.textContent="準備… "+k;},READY_MS/3));
  freshMic().then(stream=>{
    if(s.cancelled)return;
    s.stream=stream;
    const mt=mimePick();
    let rec;
    try{rec=mt?new MediaRecorder(stream,{mimeType:mt}):new MediaRecorder(stream);}
    catch(e){try{rec=new MediaRecorder(stream);}catch(e2){finishSession(s,"🙏 這個瀏覽器不支援錄音，可以先跟著唸幾次。");return;}}
    s.rec=rec;
    s.meter=startMeter(stream);
    rec.ondataavailable=e=>{if(e.data&&e.data.size>0)s.chunks.push(e.data);};
    rec.onstop=()=>{
      const lvl=s.meter?s.meter.stop():null;s.meter=null;
      if(s.discard)return;
      const bytes=s.chunks.reduce((n,c)=>n+c.size,0);
      const silent=(lvl&&lvl.samples>=5)?lvl.peak<SILENT_PEAK:bytes<1500;   // trust the meter only if it ran
      if(!s.chunks.length||silent){
        freshMic().catch(()=>{});   // new capture now (holder is live → no prompt) so the next try works
        finishSession(s,"🎙️ 剛剛沒錄到聲音，請按 🔁 再練一次");
        return;
      }
      const blob=new Blob(s.chunks,{type:rec.mimeType||mt||"audio/mp4"});
      if(recordings[s.u])URL.revokeObjectURL(recordings[s.u]);
      recordings[s.u]=URL.createObjectURL(blob);
      finishSession(s,'<span class="ph">✅ 錄好了</span> 聽聽看自己唸的，跟標準比一比。',true);
      quizMark(s.dayId,s.id,"practiced");
    };
    // Recorder must be running BEFORE the red state, so the first syllable isn't cut.
    let went=false;
    const go=()=>{if(went||s.cancelled)return;went=true;
      s.timers.push(setTimeout(()=>beginRedPhase(s,it,secs),Math.max(0,READY_MS-(Date.now()-readyAt))));};
    rec.onstart=go;
    try{rec.start(250);}catch(e){try{rec.start();}catch(e2){finishSession(s,"🎙️ 剛剛沒錄到聲音，請按 🔁 再練一次");return;}}
    s.timers.push(setTimeout(go,1200));   // fallback if 'start' never fires
  }).catch(err=>{
    if(s.cancelled)return;
    const denied=err&&(err.name==="NotAllowedError"||err.name==="SecurityError");
    finishSession(s,denied
      ?"🎙️ 麥克風沒有被允許。請到 iPhone「設定 → Safari → 麥克風」改成「允許」，或在網址列左邊的「大小」選單允許麥克風，然後按 🔁 再練一次。"
      :"🎙️ 打不開麥克風（"+esc(err&&err.name||"error")+"），請再試一次。");
  });
}
function beginRedPhase(s,it,secs){
  if(s.cancelled)return;
  clearTimers(s);   // ends the 3-2-1 ticker
  const p=panel(s.u);
  setPhase(p,"rec",`<div class="st"><span class="dot"></span><span class="turn">🔴 換你唸</span>
      <span class="cd" id="cd-${s.u}">${secs.toFixed(1)}s</span>
      <button class="btn stop" id="stop-${s.u}">停止</button></div>
    ${modelsHTML(it)}
    <div class="tbar"><div id="tb-${s.u}"></div></div>`);
  const sb=document.getElementById("stop-"+s.u);if(sb)sb.onclick=()=>stopRecording(s);
  const t0=Date.now(),tb=document.getElementById("tb-"+s.u);
  if(tb){tb.style.transition="none";tb.style.width="100%";void tb.offsetWidth;
    tb.style.transition=`width ${secs}s linear`;tb.style.width="0%";}   // bar runs exactly the window
  s.timers.push(setInterval(()=>{
    const r=Math.max(0,secs-(Date.now()-t0)/1000),cd=document.getElementById("cd-"+s.u);
    if(cd)cd.textContent=r.toFixed(1)+"s";
  },100));
  s.timers.push(setTimeout(()=>stopRecording(s),secs*1000));
}
function stopRecording(s){
  if(s.cancelled||!s.rec||s.rec.state==="inactive")return;
  clearTimers(s);
  const cd=document.getElementById("cd-"+s.u);if(cd)cd.textContent="0.0s";
  try{s.rec.stop();}catch(e){finishSession(s,"🎙️ 剛剛沒錄到聲音，請按 🔁 再練一次");}
}
function playMine(dayId,id){
  const u=uid(dayId,id),url=recordings[u];if(!url)return;
  if(cur)stopShadow();
  if(TTS){try{TTS.cancel();}catch(e){}}
  if(!player){player=document.createElement("audio");player.setAttribute("playsinline","");player.preload="auto";document.body.appendChild(player);}
  stopPlayer();
  player.src=url;
  const pr=player.play();
  if(pr&&pr.catch)pr.catch(()=>{const p=panel(u);if(p)p.insertAdjacentHTML("afterbegin",'<div class="hint">播放失敗，再按一次試試。</div>');});
}
function replayModel(dayId,id){
  const [d,it]=find(dayId,id);
  if(cur)stopShadow();
  stopPlayer();
  if(!TTS||!window.SpeechSynthesisUtterance)return;
  try{TTS.cancel();}catch(e){}
  keepUtts=modelTexts(it).map(t=>{const u=new SpeechSynthesisUtterance(t);u.lang="en-US";if(enVoice)u.voice=enVoice;u.rate=0.9;return u;});
  keepUtts.forEach(u=>TTS.speak(u));
}

window.addEventListener("hashchange",route);
route();
</script>
